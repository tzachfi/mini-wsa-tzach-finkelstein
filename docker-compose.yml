services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: miniwsa
      POSTGRES_USER: miniwsa
      POSTGRES_PASSWORD: miniwsa
    # Not published on the host. The app reaches this instance as postgres:5432
    # on the Compose network, so `docker compose up` does not fight a local Postgres.
    volumes:
      - miniwsa-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniwsa -d miniwsa"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - miniwsa

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v3/api-docs"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - miniwsa

volumes:
  miniwsa-postgres:

networks:
  miniwsa:
