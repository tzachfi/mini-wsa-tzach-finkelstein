server:
  port: 8080

spring:
  application:
    name: mini-wsa
  datasource:
    url: jdbc:postgresql://localhost:5432/miniwsa
    username: miniwsa
    password: miniwsa
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs
  api-docs:
    path: /v3/api-docs
